name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Railway Version
        run: railway --version

      - name: Deploy
        run: railway up --project 020103ea-199a-465c-9321-08d34d4c31dd --service 627f06ae-4288-4dc4-93f3-f9c2a42f8f72
