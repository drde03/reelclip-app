name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Railway CLI
        uses: railwayapp/setup-railway-cli@v3
        with:
          api-token: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy
        run: railway up --project 020103ea-199a-465c-9321-08d34d4c31dd --service 627f06ae-4288-4dc4-93f3-f9c2a42f8f72
